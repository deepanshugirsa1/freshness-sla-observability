name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Registry must have an owner and a target for every source
        run: python -m obs.cli --offline migrate && python -m obs.cli --offline registry-audit
      - name: Smoke the check loop end to end
        run: python -m obs.cli --offline seed && python -m obs.cli --offline check
